name: Multi-OS Release

on:
  push:
    tags:
      - '[0-9]*' # 2.8.7 や 2.0.0 などの数字で始まるタグで起動 (vなし)
      - 'v[0-9]*' # v2.8.7 形式にも対応
  workflow_dispatch: # Web画面からの手動実行も可能

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true" # 明示的に Node.js 24 ランタイムでの実行を指示

permissions:
  contents: write # Release公開権限

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            override_dir: for_linux
          - platform: mac
            os: ubuntu-latest
            override_dir: for_mac
          - platform: win
            os: windows-latest
            override_dir: ""

    steps:
      # 1. コードを取得
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Go 言語環境のセットアップ (Windowsランチャーのビルド用 / go.sum警告を無効化)
      - name: Set up Go
        if: matrix.platform == 'win'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      # 3. Python 3.10.11 環境のセットアップ (Windows依存パッケージ構築 ＋ キャッシュ有効化)
      - name: Set up Python 3.10
        if: matrix.platform == 'win'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      # 4. リリース用パッケージを作成
      - name: Prepare Release Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="custom-$(git rev-parse --short HEAD)"
          fi

          ARCHIVE_NAME="Resolve_Script-${VERSION}_${{ matrix.platform }}.zip"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

          # パッケージ作成用の一時ディレクトリ dist を作成
          mkdir -p dist

          # ① 配布に必要な共通フォルダ・ファイルをコピー
          cp -r app bin library Preset Scripts Templates data requirements.txt README.md LICENSE dist/

          # ② 不要なソース・ビルドスクリプト・キャッシュを除去
          rm -rf dist/data/app/launcher/launcher.go dist/data/app/launcher/build.sh 2>/dev/null || true
          find dist -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find dist -type f -name "*.pyc" -delete 2>/dev/null || true

          # ③ OS固有の設定・スクリプトで上書き展開 (Linux / Mac)
          if [ -n "${{ matrix.override_dir }}" ] && [ -d "${{ matrix.override_dir }}" ]; then
            cp -r ${{ matrix.override_dir }}/* dist/
            chmod +x dist/*.sh dist/*.command 2>/dev/null || true
          fi

          # ④ Windows固有処理 (Python 3.10.11 Embeddable 構築 ＋ AHK同梱 ＋ Goランチャーのビルド)
          if [ "${{ matrix.platform }}" = "win" ]; then
            # AHK (AutoHotkey) フォルダの同梱
            if [ -d "AHK" ]; then
              cp -r AHK dist/
            fi

            # (a) Python 3.10.11 Embeddable を取得して展開
            mkdir -p dist/bin/python-3.10.11
            curl -sSL "https://www.python.org/ftp/python/3.10.11/python-3.10.11-embed-amd64.zip" -o python-embed.zip
            unzip -q python-embed.zip -d dist/bin/python-3.10.11
            rm python-embed.zip

            # import site を有効化
            sed -i 's/#import site/import site/' dist/bin/python-3.10.11/python310._pth

            # pip のインストールと requirements.txt の依存構築
            curl -sSL "https://bootstrap.pypa.io/get-pip.py" -o dist/bin/python-3.10.11/get-pip.py
            python dist/bin/python-3.10.11/get-pip.py --no-warn-script-location
            python -m pip install -r requirements.txt --target dist/bin/python-3.10.11/Lib/site-packages
            rm dist/bin/python-3.10.11/get-pip.py

            # (b) Go ランチャー (.exe) のビルド
            chmod +x data/app/launcher/build.sh
            ./data/app/launcher/build.sh data/app/launcher/launcher.go dist
            cp dist/launcher.exe dist/Resolve.exe
            cp dist/launcher.exe dist/Fusion.exe
            mv dist/launcher.exe dist/りぞりぷと.exe
          fi

          # ⑤ dist の中身を ZIP アーカイブ化
          cd dist
          if command -v zip >/dev/null 2>&1; then
            zip -r "../${ARCHIVE_NAME}" .
          else
            7z a "../${ARCHIVE_NAME}" .
          fi
          cd ..

      # 5. 作成された ZIP パッケージを一時 Artifact としてアップロード
      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zips-${{ matrix.platform }}
          path: ${{ env.ARCHIVE_NAME }}

  publish-release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 1. すべての OS 向け ZIP Artifacts をダウンロード
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-zips-*
          merge-multiple: true

      # 2. GitHub Releases に 3 つの ZIP を一括添付して公開
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
