name: 'Setup Python Embeddable'
description: 'Windows 用 Python 3.10 Embeddable 環境を構築・キャッシュします'
runs:
  using: "composite"
  steps:
    - name: Cache Windows Embeddable Python
      id: cache-python-embed
      uses: actions/cache@v4
      with:
        path: .cache/python-embed
        key: ${{ runner.os }}-python-embed-${{ hashFiles('requirements.txt') }}

    - name: Set up Python 3.10
      if: steps.cache-python-embed.outputs.cache-hit != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.11'

    - name: Build Python Embeddable Environment
      if: steps.cache-python-embed.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "Cache miss: Building Python 3.10.11 Embeddable cache..."
        rm -rf .cache/python-embed
        mkdir -p .cache/python-embed
        curl -sSL "https://www.python.org/ftp/python/3.10.11/python-3.10.11-embed-amd64.zip" -o python-embed.zip
        unzip -q python-embed.zip -d .cache/python-embed
        rm python-embed.zip

        sed -i 's/#import site/import site/' .cache/python-embed/python310._pth
        cp data/app/launcher/sitecustomize.py .cache/python-embed/

        curl -sSL "https://bootstrap.pypa.io/get-pip.py" -o .cache/python-embed/get-pip.py
        python .cache/python-embed/get-pip.py --no-warn-script-location
        python -m pip install -r requirements.txt --target .cache/python-embed/Lib/site-packages
        rm .cache/python-embed/get-pip.py
